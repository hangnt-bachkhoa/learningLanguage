<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Full-Bleed Vintage Parchment Background (NO transparency, fits iOS squircle perfectly) -->
  <rect width="512" height="512" fill="#F8F4EB"/>

  <defs>
    <path id="topTextArc" d="M 96,256 A 160,160 0 1,1 416,256" fill="none"/>
  </defs>

  <!-- Centered Circular Medallion -->
  <!-- Outer Ring (Radius 184 leaves safe 72px margin to all 4 edges, perfectly within squircle) -->
  <circle cx="256" cy="256" r="184" fill="#FFFDF9" stroke="#D9C8B5" stroke-width="4"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#E8D7A8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="256" cy="256" r="132" fill="#F8F4EB" stroke="#E8D7A8" stroke-width="2"/>

  <!-- Curved Serif Text "LANGUAGE FARM" -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#263847" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">LANGUAGE FARM</textPath>
  </text>

  <!-- Botanical Laurel Accent Leaves -->
  <g fill="#78815D">
    <ellipse cx="106" cy="256" rx="7" ry="14" transform="rotate(-30 106 256)"/>
    <ellipse cx="406" cy="256" rx="7" ry="14" transform="rotate(30 406 256)"/>
  </g>
  <g fill="#A65E65">
    <ellipse cx="114" cy="282" rx="6" ry="12" transform="rotate(25 114 282)"/>
    <ellipse cx="398" cy="282" rx="6" ry="12" transform="rotate(-25 398 282)"/>
  </g>

  <!-- Bottom Accent: Balanced 3 Vintage Gold Stars centered in ring band (y=412) -->
  <g fill="#D4A338" transform="translate(256, 412)">
    <!-- Center star -->
    <polygon points="0,-9 2.7,-2.7 9,-2.7 3.6,1.8 5.4,8.1 0,4.5 -5.4,8.1 -3.6,1.8 -9,-2.7 -2.7,-2.7" />
    <!-- Left star -->
    <polygon points="-28,-7.2 -25.6,-2.2 -20.8,-2.2 -25.2,1.4 -23.4,6.5 -28,3.6 -32.6,6.5 -30.8,1.4 -35.2,-2.2 -30.4,-2.2" />
    <!-- Right star -->
    <polygon points="28,-7.2 30.4,-2.2 35.2,-2.2 30.8,1.4 32.6,6.5 28,3.6 23.4,6.5 25.2,1.4 20.8,-2.2 25.6,-2.2" />
  </g>

  <!-- Pixel-Art Open Book + Sprout Centerpiece -->
  <g transform="translate(160, 162) scale(12)" shape-rendering="crispEdges">
    <!-- Open Book Base Shadow -->
    <rect x="1" y="8" width="14" height="6" fill="#1C2B36"/>
    <!-- Book Pages -->
    <rect x="2" y="7" width="5" height="6" fill="#FFFDF9"/>
    <rect x="9" y="7" width="5" height="6" fill="#FFFDF9"/>
    <!-- Spine Binding -->
    <rect x="7" y="8" width="2" height="5" fill="#D9C8B5"/>
    <rect x="2" y="13" width="12" height="1" fill="#D4A338"/>
    <!-- Dusty Rose Ribbon / Bookmark -->
    <rect x="3" y="10" width="2" height="1" fill="#A65E65"/>
    <rect x="11" y="10" width="2" height="1" fill="#A65E65"/>
    <!-- Olive Green Stem -->
    <rect x="7" y="4" width="2" height="4" fill="#5E8A42"/>
    <!-- Sprout Leaves -->
    <rect x="4" y="2" width="3" height="2" fill="#5E8A42"/>
    <rect x="5" y="1" width="2" height="1" fill="#88B84B"/>
    <rect x="9" y="1" width="3" height="2" fill="#88B84B"/>
    <rect x="9" y="3" width="2" height="1" fill="#5E8A42"/>
  </g>
</svg>
