<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="96" height="96" shape-rendering="crispEdges">
  <!-- Outer Dark Outline & Rounded Soil Frame -->
  <rect x="1" y="1" width="14" height="14" fill="#3B2D24"/>
  <rect x="0" y="2" width="1" height="12" fill="#3B2D24"/>
  <rect x="15" y="2" width="1" height="12" fill="#3B2D24"/>
  <rect x="2" y="0" width="12" height="1" fill="#3B2D24"/>
  <rect x="2" y="15" width="12" height="1" fill="#3B2D24"/>

  <!-- Wooden / Earth Rim -->
  <rect x="1" y="2" width="14" height="12" fill="#6E4F35"/>
  <rect x="2" y="1" width="12" height="14" fill="#6E4F35"/>
  <rect x="2" y="2" width="12" height="1" fill="#8C6646"/>

  <!-- Textured Dry Soil Surface -->
  <rect x="2" y="3" width="12" height="10" fill="#9C734E"/>
  <rect x="3" y="4" width="2" height="1" fill="#B58962"/>
  <rect x="9" y="5" width="2" height="1" fill="#B58962"/>
  <rect x="5" y="8" width="2" height="1" fill="#B58962"/>
  <rect x="10" y="10" width="2" height="1" fill="#B58962"/>
  <rect x="6" y="5" width="1" height="1" fill="#7D5A3B"/>
  <rect x="11" y="7" width="1" height="1" fill="#7D5A3B"/>
  <rect x="4" y="10" width="1" height="1" fill="#7D5A3B"/>
  <rect x="8" y="11" width="1" height="1" fill="#7D5A3B"/>
  <rect x="2" y="12" width="12" height="1" fill="#7D5A3B"/>
</svg>