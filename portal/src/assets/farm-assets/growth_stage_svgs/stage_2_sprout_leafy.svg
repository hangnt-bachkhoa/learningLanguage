<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="96" height="96" shape-rendering="crispEdges">
  <!-- Soil Base -->
  <rect x="5" y="12" width="6" height="2" fill="#3B2D24"/>
  <rect x="6" y="12" width="4" height="1" fill="#6E4F35"/>

  <!-- Dark Outline -->
  <rect x="6" y="7" width="4" height="6" fill="#3B2D24"/>
  <rect x="2" y="5" width="5" height="4" fill="#3B2D24"/>
  <rect x="9" y="4" width="5" height="4" fill="#3B2D24"/>
  <rect x="6" y="3" width="4" height="4" fill="#3B2D24"/>

  <!-- Stem -->
  <rect x="7" y="6" width="2" height="6" fill="#5D6646"/>
  <rect x="7" y="6" width="1" height="5" fill="#78815D"/>

  <!-- Left & Right Leaves -->
  <rect x="3" y="6" width="3" height="2" fill="#78815D"/>
  <rect x="4" y="6" width="2" height="1" fill="#9BB068"/>
  <rect x="10" y="5" width="3" height="2" fill="#78815D"/>
  <rect x="10" y="5" width="2" height="1" fill="#B5C97B"/>

  <!-- Top Center Leaf -->
  <rect x="7" y="4" width="2" height="2" fill="#9BB068"/>
  <rect x="7" y="4" width="1" height="1" fill="#B5C97B"/>
</svg>