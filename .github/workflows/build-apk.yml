name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'portal/package-lock.json'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install API 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Portal Dependencies
        run: npm --prefix portal ci

      - name: Build Angular Web & Sync Capacitor
        run: |
          npm --prefix portal run build
          cd portal && npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x portal/android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd portal/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Language-Farm-Debug-APK
          path: portal/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
