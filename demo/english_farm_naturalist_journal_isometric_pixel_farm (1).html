<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Farm — Naturalist Journal & Isometric Pixel Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #F5F1E8;
      --bg-paper-dark: #EAE2D2;
      --bg-card: #FCF9F2;
      --navy: #263847;
      --navy-light: #344B5E;
      --rose: #A65E65;
      --rose-hover: #8F4D53;
      --rose-soft: #F3E4E5;
      --olive: #78815D;
      --olive-soft: #E9ECE1;
      --gold: #E8D7A8;
      --gold-pixel: #E4B43C;
      --gold-dark: #9B7424;
      --border: #DDD2C1;
      --border-strong: #C2AD95;
      --ink: #2C2A25;
      --ink-muted: #6E675C;
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-soft: 0 2px 12px rgba(38, 56, 71, 0.05);
      --shadow-book: 6px 8px 18px rgba(38, 56, 71, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background-color: var(--bg-paper);
      background-image:
        radial-gradient(rgba(194, 173, 149, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.25), rgba(234,226,210,0.25));
      background-size: 18px 18px, 100% 100%;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    input, textarea {
      font-family: inherit;
      color: var(--ink);
    }

    .pixel-art {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      shape-rendering: crispEdges;
    }

    /* App Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Navy Sidebar */
    .sidebar {
      width: 224px;
      background: var(--navy);
      color: #F8F4EB;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 18px;
      border-bottom: 1px solid rgba(248, 244, 235, 0.14);
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(232, 215, 168, 0.14);
      border: 1px solid rgba(232, 215, 168, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: #FFFDF9;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 10.5px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.9;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      color: rgba(248, 244, 235, 0.78);
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFDF9;
    }

    .nav-item.active {
      background: var(--rose);
      color: #FFFDF9;
      font-weight: 600;
    }

    .nav-badge {
      margin-left: auto;
      background: var(--gold);
      color: var(--navy);
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
    }

    .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid rgba(248, 244, 235, 0.14);
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 6px;
    }

    .avatar-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--olive);
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 700;
      color: #FFFDF9;
      font-size: 14px;
      flex-shrink: 0;
    }

    .main-wrap {
      flex: 1;
      margin-left: 224px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Archival Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(245, 241, 232, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
    }

    .stat-pill.gold {
      background: #FBF6E6;
      border-color: #DFC98E;
      color: var(--gold-dark);
    }

    .stat-pill.olive {
      background: var(--olive-soft);
      border-color: #C3CAAE;
      color: #4D5538;
    }

    .cart-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--navy);
      color: #FFFDF9;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .cart-count {
      background: var(--rose);
      color: #FFFDF9;
      border-radius: 999px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .content-container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 24px 96px;
    }

    /* Naturalist Journal Archival Card */
    .vintage-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-soft);
      padding: 18px;
      position: relative;
    }

    /* Gold Pixel Corner Frame (from reference image 3) */
    .pixel-frame {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .corner-px {
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .corner-tl { top: 6px; left: 6px; }
    .corner-tr { top: 6px; right: 6px; transform: scaleX(-1); }
    .corner-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
    .corner-br { bottom: 6px; right: 6px; transform: scale(-1, -1); }

    .archival-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 12px;
      color: var(--ink-muted);
      font-size: 10.5px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .archival-divider::before,
    .archival-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--navy);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .btn-primary { background: var(--rose); color: #FFFDF9; }
    .btn-primary:hover { background: var(--rose-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background: var(--bg-paper);
      border: 1px solid var(--border-strong);
      color: var(--navy);
    }
    .btn-secondary:hover { background: var(--bg-paper-dark); }

    .btn-olive { background: var(--olive); color: #FFFDF9; }
    .btn-olive:hover { background: #656E4D; }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

    /* 3D Planner Books */
    .books-shelf {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .planner-book-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-soft);
      transition: transform 0.18s ease;
    }
    .planner-book-wrap:hover { transform: translateY(-2px); }

    .book-3d {
      position: relative;
      width: 156px;
      height: 202px;
      border-radius: 6px 12px 12px 6px;
      padding: 18px 14px 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFDF9;
      box-shadow: var(--shadow-book);
      margin-bottom: 14px;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
    }

    .book-3d::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 12px;
      background: rgba(0, 0, 0, 0.18);
      border-right: 1px solid rgba(255, 255, 255, 0.18);
    }

    .book-3d::after {
      content: '';
      position: absolute;
      left: 10px; right: 4px; bottom: 0;
      height: 9px;
      background: repeating-linear-gradient(to bottom, #F5F1E8 0px, #F5F1E8 2px, #D9C8B5 2px, #D9C8B5 3px);
      border-radius: 0 0 8px 0;
    }

    .book-edit-btn {
      position: absolute;
      top: 8px; right: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #FFFDF9;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      z-index: 2;
    }

    .book-tag {
      display: inline-block;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(255, 255, 255, 0.18);
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .book-title { font-family: var(--font-serif); font-size: 18px; font-weight: 700; line-height: 1.2; }
    .book-subtitle { font-size: 11px; opacity: 0.86; margin-top: 4px; }

    .book-progress-bar {
      width: 100%;
      height: 7px;
      background: var(--bg-paper-dark);
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0;
    }

    .book-progress-fill {
      height: 100%;
      background: var(--olive);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .book-stats { font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; }

    /* Review Planner */
    .tabs-bar {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--bg-paper);
      border: 1px solid var(--border);
    }
    .tab-btn.active { background: var(--navy); color: #FFFDF9; border-color: var(--navy); }

    .planner-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 16px;
      align-items: start;
    }

    .planner-side {
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .range-btn {
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-muted);
    }
    .range-btn.active {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--navy);
      font-weight: 700;
    }

    .ring-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-card);
    }

    table.ebbinghaus-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 540px; }
    .ebbinghaus-table th {
      background: var(--bg-paper);
      color: var(--navy);
      font-weight: 700;
      text-align: center;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .ebbinghaus-table td { text-align: center; padding: 9px 8px; border-bottom: 1px solid #EFE7DA; }
    .ebbinghaus-table tr.today-row { background: #FBF6E6; }

    .review-circle {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      color: var(--ink-muted);
      background: #FFFDF9;
    }
    .review-circle.done { background: var(--rose); border-color: var(--rose); color: #FFFDF9; }

    /* Naturalist Specimen Flashcard (Inspired by image_639c6a.jpg) */
    .flashcard {
      max-width: 660px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-soft);
    }

    .specimen-stage {
      position: relative;
      background: radial-gradient(circle at center, #F3EEE2 0%, var(--bg-card) 72%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }

    .callout-tag {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 12px;
      color: var(--ink-muted);
      border-bottom: 1px solid var(--border-strong);
      padding-bottom: 2px;
    }

    .vocab-word {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 38px;
      font-weight: 600;
      color: var(--navy);
      text-align: center;
      line-height: 1.15;
    }

    .ipa-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }

    .ipa-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--navy);
    }

    .archival-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }

    .archival-meta-label {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .archival-meta-val {
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--navy);
      font-weight: 600;
      margin-top: 2px;
    }

    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #FFFDF9;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quiz-option:hover:not(:disabled) { border-color: var(--navy); background: var(--bg-paper); }
    .quiz-option.correct { border-color: var(--olive); background: var(--olive-soft); color: #363D25; font-weight: 700; }
    .quiz-option.wrong { border-color: var(--rose); background: var(--rose-soft); color: #6B2D33; }

    /* TOP-DOWN 3x3 TEXTURED SOIL FARM GRID (Matching English Farm Mockup) */
    .farm-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      align-items: start;
    }

    .farm-board {
      background: #E8DFC8;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-soft);
    }

    .soil-grid-frame {
      background: #D9CBB2;
      border: 2px solid #B8A487;
      border-radius: 14px;
      padding: 12px;
      max-width: 390px;
      margin: 10px auto 14px;
    }

    .soil-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .soil-plot {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background-color: #936E4E;
      background-image:
        radial-gradient(#78563A 12%, transparent 13%),
        radial-gradient(#AD8663 10%, transparent 11%);
      background-size: 14px 14px;
      background-position: 0 0, 7px 7px;
      border: 2.5px solid #6E4F35;
      box-shadow: inset 0 2px 5px rgba(40, 25, 12, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      overflow: hidden;
    }

    .soil-plot.wet {
      background-color: #6B4C32;
      background-image:
        radial-gradient(#523823 14%, transparent 15%),
        radial-gradient(#805D40 10%, transparent 11%);
      border-color: #4D3521;
    }

    .soil-plot.locked {
      background-color: #A1907D;
      background-image:
        radial-gradient(#8B7B69 12%, transparent 13%),
        radial-gradient(#B4A491 10%, transparent 11%);
      border-color: #7D6E5D;
      opacity: 0.92;
    }

    .soil-plot.selected {
      box-shadow: 0 0 0 3px var(--gold), 0 0 0 5px var(--navy);
      transform: scale(1.03);
      z-index: 2;
    }

    .plot-status-tag {
      position: absolute;
      bottom: 4px;
      left: 5px;
      right: 5px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(38, 56, 71, 0.82);
      color: #FFFDF9;
    }
    .plot-status-tag.ready { background: var(--olive); }
    .plot-status-tag.locked { background: rgba(74, 65, 55, 0.85); }

    .farm-toolbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .action-tile {
      background: var(--bg-card);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--navy);
    }
    .action-tile:hover { border-color: var(--rose); background: var(--rose-soft); }

    /* Shop Grid */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .product-thumb {
      height: 92px;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(38, 56, 71, 0.55);
      display: none;
      align-items: center;
      justify-content: center;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function speakWord(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
          showToast(`🔊 Đang phát âm: "${text}"`);
          return;
        }
      } catch (e) {}
      showToast(`🔊 Phát âm mẫu: "${text}"`);
    }

      return `
        <div class="flashcard">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <span style="font-family:var(--font-serif);font-size:15px;color:var(--navy);font-weight:600;">Specimen №${v.specimenNo}</span>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-secondary btn-sm" onclick="toggleBookmark(${state.vocabIndex})">
                ${v.bookmarked ? '★ Đã lưu' : '☆ Lưu thẻ'}
              </button>
              <button class="btn btn-olive btn-sm" onclick="navigate('quiz')">Làm Quiz →</button>
            </div>
          </div>

          <div class="specimen-stage">
            <div style="display:flex;align-items:center;gap:18px;margin-bottom:10px;">
              <span class="callout-tag">Pixel Sprite</span>
              <div style="transform:scale(1.25);">${SPRITES[v.sprite] || SPRITES.carrot}</div>
              <span class="callout-tag">${v.type}</span>
            </div>
            <div class="vocab-word">${v.word}</div>
            <div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-muted);margin-top:4px;">ENGLISH FARM ARCHIVE</div>
          </div>

          <div class="ipa-row">
            <button class="ipa-btn" onclick="speakWord('${v.word}')">🔊 US ${v.ipaUs}</button>
            <button class="ipa-btn" onclick="speakWord('${v.word}')">🔊 UK ${v.ipaUk}</button>
          </div>

          <div class="archival-meta-grid">
            <div>
              <div class="archival-meta-label">Nghĩa tiếng Việt</div>
              <div class="archival-meta-val">${v.meaning}</div>
            </div>
            <div>
              <div class="archival-meta-label">Loại từ</div>
              <div class="archival-meta-val">${v.type}</div>
            </div>
          </div>

          <div style="margin-bottom:14px;">
            <div class="archival-meta-label" style="margin-bottom:4px;">Ví dụ song ngữ</div>
            <div style="font-family:var(--font-serif);font-size:16px;color:var(--navy);">"${v.enEx}"</div>
            <div style="font-size:13px;color:var(--ink-muted);">${v.viEx}</div>
          </div>

          <div style="margin-bottom:18px;">
            <label class="archival-meta-label" style="display:block;margin-bottom:5px;">Ghi chú cá nhân</label>
            <input type="text" value="${v.note}" placeholder="Thêm mẹo ghi nhớ..." onchange="state.vocabList[${state.vocabIndex}].note=this.value; showToast('Đã lưu ghi chú.');"
              style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-paper);" />
          </div>

          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
            <div style="display:flex;gap:8px;">
              <button class="btn btn-secondary" ${state.vocabIndex===0?'disabled':''} onclick="state.vocabIndex--; renderMain();">← Trước</button>
              <button class="btn btn-secondary" ${state.vocabIndex===state.vocabList.length-1?'disabled':''} onclick="state.vocabIndex++; renderMain();">Sau →</button>
            </div>
            <button class="btn ${v.learned ? 'btn-olive' : 'btn-primary'}" onclick="markVocabLearned(${state.vocabIndex})">
              ${v.learned ? '✓ Đã thuộc từ này' : 'Đánh dấu Đã học'}
            </button>
          </div>
        </div>
      `;
    }

    function toggleBookmark(idx) {
      state.vocabList[idx].bookmarked = !state.vocabList[idx].bookmarked;
      renderMain();
    }

    function markVocabLearned(idx) {
      const v = state.vocabList[idx];
      if (!v.learned) {
        v.learned = true;
        state.xp += 15;
        state.books[0].learned += 1;
        showToast(`✓ Đã học "${v.word}" (+15 XP)`);
      }
      renderAll();
    }

    // ============== SCREEN 04 & 06: QUIZ & RESULT ==============
    function renderQuiz() {
      const q = state.quizQuestions[state.quizIndex];
      const pct = Math.round(((state.quizIndex + (state.quizSelected !== null ? 1 : 0)) / state.quizQuestions.length) * 100);
      return `
        <div class="flashcard">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:13px;font-weight:700;color:var(--navy);">Câu ${state.quizIndex + 1} / ${state.quizQuestions.length}</span>
            <span style="font-size:12.5px;color:var(--olive);font-weight:600;">Đạt ≥ 80% để nhận thưởng</span>
          </div>
          <div class="book-progress-bar" style="margin-bottom:20px;">
            <div class="book-progress-fill" style="width:${pct}%;"></div>
          </div>

          <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:18px;">
            <div class="pixel-frame" style="padding:14px;margin-bottom:12px;">
              ${cornerFramesHtml()}
              ${SPRITES[q.sprite]}
            </div>
            <h2 style="font-family:var(--font-serif);font-size:21px;color:var(--navy);text-align:center;">${q.prompt}</h2>
          </div>

          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px;">
            ${q.options.map((opt, i) => {
              let cls = 'quiz-option';
              let icon = '';
              if (state.quizSelected !== null) {
                if (i === q.answer) { cls += ' correct'; icon = '✓ Đúng'; }
                else if (i === state.quizSelected) { cls += ' wrong'; icon = '✕ Chưa đúng'; }
              }
              return `
                <button class="${cls}" ${state.quizSelected !== null ? 'disabled' : ''} onclick="selectQuizOption(${i})">
                  <span><strong>${String.fromCharCode(65+i)}.</strong> ${opt}</span>
                  <span style="font-size:12px;">${icon}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div style="display:flex;justify-content:flex-end;">
            <button class="btn btn-primary" ${state.quizSelected === null ? 'disabled' : ''} onclick="nextQuizStep()">
              ${state.quizIndex === state.quizQuestions.length - 1 ? 'Xem kết quả →' : 'Câu tiếp theo →'}
            </button>
          </div>
        </div>
      `;
    }

    function selectQuizOption(idx) {
      if (state.quizSelected !== null) return;
      state.quizSelected = idx;
      if (idx === state.quizQuestions[state.quizIndex].answer) state.quizScore += 1;
      renderMain();
    }

    function nextQuizStep() {
      if (state.quizIndex < state.quizQuestions.length - 1) {
        state.quizIndex += 1;
        state.quizSelected = null;
        renderMain();
      } else {
        const pct = Math.round((state.quizScore / state.quizQuestions.length) * 100);
        if (pct >= 80 && !state.quizRewardClaimed) {
          state.quizRewardClaimed = true;
          state.xp += 50;
          state.coins += 30;
          state.inventory.seeds.carrot += 2;
          state.inventory.water += 2;
          state.inventory.fertilizer += 1;
        }
        state.screen = 'result';
        renderAll();
      }
    }

    function resetQuiz() {
      state.quizIndex = 0;
      state.quizSelected = null;
      state.quizScore = 0;
      navigate('quiz');
    }

    function renderResult() {
      const pct = Math.round((state.quizScore / state.quizQuestions.length) * 100);
      const passed = pct >= 80;
      const carrots = state.inventory.harvested.carrot;
      return `
        <div class="flashcard" style="text-align:center;">
          <div style="font-size:12px;font-weight:700;color:${passed?'var(--olive)':'var(--rose)'};text-transform:uppercase;letter-spacing:0.8px;">
            ${passed ? 'Hoàn thành xuất sắc!' : 'Cần ôn tập thêm'}
          </div>
          <div style="font-family:var(--font-serif);font-size:44px;font-weight:700;color:var(--navy);margin:6px 0;">${pct}%</div>
          <p style="color:var(--ink-muted);margin-bottom:20px;">Bạn trả lời đúng ${state.quizScore}/${state.quizQuestions.length} câu hỏi (Yêu cầu vượt qua: 80%).</p>

          ${passed ? `
            <div class="pixel-frame" style="margin-bottom:18px;text-align:left;">
              ${cornerFramesHtml()}
              <div style="font-weight:700;color:var(--navy);margin-bottom:10px;">Phần thưởng nhận được:</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span class="stat-pill olive">+50 XP</span>
                <span class="stat-pill gold">+30 Xu</span>
                <span class="stat-pill">+2 Hạt Cà rốt</span>
                <span class="stat-pill">+2 Nước</span>
                <span class="stat-pill">+1 Phân bón</span>
              </div>
            </div>
          ` : ''}

          <div style="background:var(--bg-paper);border:1px dashed var(--border-strong);border-radius:12px;padding:14px;margin-bottom:20px;text-align:left;">
            <div style="font-weight:700;color:var(--navy);font-size:13.5px;">Điều kiện mở khóa bài tiếp theo: Animals</div>
            <div style="font-size:12.5px;color:var(--ink-muted);margin-top:3px;">Thu hoạch đủ 3 Củ cà rốt trong nông trại (Hiện có: <strong>${carrots}/3</strong>).</div>
          </div>

          <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="resetQuiz()">Làm lại Quiz</button>
            <button class="btn btn-primary" onclick="navigate('farm')">🌱 Về Nông trại trồng cây</button>
          </div>
        </div>
      `;
    }

    // ============== SCREEN 05: TOP-DOWN 3x3 FARM ==============
    function renderFarm() {
      const selectedPlot = state.plots[state.selectedPlotId];
      const statusMap = {
        locked: 'Đã khóa (50 Xu)',
        empty: 'Đất trống',
        seeded: 'Đã gieo hạt',
        growing: 'Đang lớn',
        ready: 'Sẵn sàng thu hoạch!'
      };

      return `
        <div class="farm-layout">
          <div class="farm-board">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
              <div>
                <h2 style="font-family:var(--font-serif);font-size:19px;color:var(--navy);">Vườn của tôi (3×3)</h2>
                <div style="font-size:12px;color:var(--ink-muted);">Chọn một ô đất rồi nhấn hành động bên dưới</div>
              </div>
              <span class="stat-pill">Ô #${state.selectedPlotId + 1}</span>
            </div>

            <div class="soil-grid-frame">
              <div class="soil-grid">
                ${state.plots.map(p => {
                  let spriteHtml = '';
                  if (p.status === 'locked') spriteHtml = SPRITES.padlock;
                  else if (p.status === 'seeded') spriteHtml = SPRITES.seeds_on_soil;
                  else if (p.status === 'growing') spriteHtml = SPRITES.sprout;
                  else if (p.status === 'ready') spriteHtml = SPRITES[p.crop] || SPRITES.carrot;

                  const tagCls = p.status === 'ready' ? 'ready' : p.status === 'locked' ? 'locked' : '';
                  const tagText = p.status === 'locked' ? 'Khóa' : p.status === 'empty' ? 'Trống' : p.status === 'ready' ? 'Thu hoạch!' : `${p.progress}%`;

                  return `
                    <button class="soil-plot ${p.watered ? 'wet' : ''} ${p.status === 'locked' ? 'locked' : ''} ${state.selectedPlotId === p.id ? 'selected' : ''}" onclick="selectPlot(${p.id})">
                      ${spriteHtml}
                      <span class="plot-status-tag ${tagCls}">${tagText}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="farm-toolbar">
              <button class="action-tile" onclick="farmAction('plant')">
                <span style="transform:scale(0.65);height:28px;display:flex;align-items:center;">${SPRITES['seed_' + state.selectedSeedType] || SPRITES.seed}</span>
                <span>Gieo hạt</span>
              </button>
              <button class="action-tile" onclick="farmAction('water')">
                <span style="transform:scale(0.65);height:28px;display:flex;align-items:center;">${SPRITES.water}</span>
                <span>Tưới (${state.inventory.water})</span>
              </button>
              <button class="action-tile" onclick="farmAction('fertilize')">
                <span style="transform:scale(0.65);height:28px;display:flex;align-items:center;">${SPRITES.fertilizer}</span>
                <span>Bón phân (${state.inventory.fertilizer})</span>
              </button>
              <button class="action-tile" onclick="farmAction('harvest')">
                <span style="transform:scale(0.65);height:28px;display:flex;align-items:center;">${SPRITES.basket}</span>
                <span>Thu hoạch</span>
              </button>
            </div>
          </div>

          <div style="display:flex;flex-direction:column;gap:14px;">
            <div class="pixel-frame">
              ${cornerFramesHtml()}
              <div class="card-header">
                <h3 class="card-title">Chi tiết ô đất #${selectedPlot.id + 1}</h3>
                <span style="font-size:12px;font-weight:700;color:var(--olive);">${statusMap[selectedPlot.status]}</span>
              </div>
              ${selectedPlot.status === 'locked' ? `
                <p style="font-size:13px;color:var(--ink-muted);margin-bottom:10px;">Mở rộng thêm ô đất mới để trồng nhiều nông sản hơn.</p>
                <button class="btn btn-primary btn-sm" onclick="unlockPlot(${selectedPlot.id})">Mở khóa ô đất (50 Xu)</button>
              ` : `
                <div style="font-size:13px;color:var(--ink-muted);">
                  Cây trồng: <strong>${selectedPlot.crop ? getCropNameVi(selectedPlot.crop) : 'Chưa có'}</strong><br/>
                  Độ ẩm đất: <strong>${selectedPlot.watered ? 'Đã tưới ẩm' : 'Đất khô'}</strong><br/>
                  Sinh trưởng: <strong>${selectedPlot.progress}%</strong>
                </div>
              `}
            </div>

            <div class="vintage-card">
              <div class="card-header">
                <h3 class="card-title">Chọn túi hạt giống</h3>
                <button class="btn btn-secondary btn-sm" onclick="navigate('shop')">+ Mua thêm</button>
              </div>
              <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
                ${Object.entries(state.inventory.seeds).map(([key, count]) => `
                  <button onclick="state.selectedSeedType='${key}'; renderMain();"
                    style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1.5px solid ${state.selectedSeedType===key?'var(--rose)':'var(--border)'};background:${state.selectedSeedType===key?'var(--rose-soft)':'var(--bg-paper)'};">
                    <span style="transform:scale(0.65);width:28px;height:28px;display:flex;align-items:center;justify-content:center;">${SPRITES['seed_' + key] || SPRITES.seed}</span>
                    <div style="text-align:left;">
                      <div style="font-size:12px;font-weight:700;">${getCropNameVi(key)}</div>
                      <div style="font-size:11px;color:var(--ink-muted);">Còn: ${count}</div>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="vintage-card">
              <div class="card-title" style="margin-bottom:8px;">Nông sản đã thu hoạch</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${Object.entries(state.inventory.harvested).map(([k, v]) => `
                  <span class="stat-pill">${getCropNameVi(k)}: <strong>${v}</strong></span>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectPlot(id) {
      state.selectedPlotId = id;
      renderMain();
    }

    function unlockPlot(id) {
      if (state.coins < 50) { showToast('Không đủ Xu! Cần 50 Xu để mở khóa ô đất.'); return; }
      state.coins -= 50;
      state.plots[id].status = 'empty';
      showToast(`Đã mở khóa ô đất #${id + 1}!`);
      renderAll();
    }

    function farmAction(action) {
      const p = state.plots[state.selectedPlotId];
      if (p.status === 'locked') { showToast('Ô đất này đang khóa. Hãy mở khóa trước!'); return; }

      if (action === 'plant') {
        if (p.status !== 'empty') { showToast('Chỉ có thể gieo hạt trên ô đất trống!'); return; }
        if (state.inventory.seeds[state.selectedSeedType] <= 0) { showToast('Hết hạt giống loại này! Hãy ghé Cửa hàng.'); return; }
        state.inventory.seeds[state.selectedSeedType] -= 1;
        p.status = 'seeded';
        p.crop = state.selectedSeedType;
        p.progress = 25;
        p.watered = false;
        showToast(`🌱 Đã gieo hạt ${state.selectedSeedType}!`);
      } else if (action === 'water') {
        if (p.status === 'empty' || p.status === 'ready') { showToast('Ô đất này không cần tưới nước lúc này.'); return; }
        if (state.inventory.water <= 0) { showToast('Hết nước! Ôn tập bài hoặc mua thêm ở Cửa hàng.'); return; }
        state.inventory.water -= 1;
        p.watered = true;
        p.progress = Math.min(100, p.progress + 40);
        p.status = p.progress >= 100 ? 'ready' : 'growing';
        showToast('💧 Đã tưới nước! Cây phát triển nhanh hơn.');
      } else if (action === 'fertilize') {
        if (p.status === 'empty' || p.status === 'ready') { showToast('Chỉ bón phân cho cây đang lớn.'); return; }
        if (state.inventory.fertilizer <= 0) { showToast('Hết phân bón!'); return; }
        state.inventory.fertilizer -= 1;
        p.progress = Math.min(100, p.progress + 55);
        p.status = p.progress >= 100 ? 'ready' : 'growing';
        showToast('✨ Đã bón phân hữu cơ! Sinh trưởng tăng tốc.');
      } else if (action === 'harvest') {
        if (p.status !== 'ready') { showToast('Cây chưa chín để thu hoạch!'); return; }
        const crop = p.crop;
        state.inventory.harvested[crop] = (state.inventory.harvested[crop] || 0) + 1;
        state.xp += 20;
        state.coins += 15;
        p.status = 'empty';
        p.crop = null;
        p.watered = false;
        p.progress = 0;
        showToast(`🧺 Thu hoạch thành công 1 ${crop}! (+20 XP, +15 Xu)`);
      }
      renderAll();
    }

    // ============== SCREEN 07 & 08: SHOP & CART ==============
    function renderShop() {
      const cats = [
        ['all', 'Tất cả'],
        ['seeds', 'Hạt giống'],
        ['care', 'Chăm sóc'],
        ['decor', 'Trang trí'],
        ['bundle', 'Gói ưu đãi']
      ];
      const items = state.shopCategory === 'all' ? state.shopProducts : state.shopProducts.filter(p => p.cat === state.shopCategory);

      return `
        <div class="pixel-frame" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          ${cornerFramesHtml()}
          <div style="display:flex;align-items:center;gap:12px;">
            ${SPRITES.bundle}
            <div>
              <h2 style="font-family:var(--font-serif);font-size:19px;color:var(--navy);">Cửa hàng Hạt giống &amp; Vật phẩm</h2>
              <div style="font-size:12.5px;color:var(--ink-muted);">Sử dụng Xu kiếm được từ việc học tiếng Anh &amp; thu hoạch nông sản.</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="stat-pill gold">Số dư: ${state.coins} Xu</span>
            <button class="btn btn-primary btn-sm" onclick="openCartModal()">Xem giỏ (${state.cart.reduce((s,c)=>s+c.qty,0)})</button>
          </div>
        </div>

        <div class="tabs-bar">
          ${cats.map(([k, label]) => `
            <button class="tab-btn ${state.shopCategory === k ? 'active' : ''}" onclick="state.shopCategory='${k}'; renderMain();">${label}</button>
          `).join('')}
        </div>

        <div class="shop-grid">
          ${items.map(p => `
            <div class="product-card">
              <div class="product-thumb" style="cursor:pointer;" onclick="openProductDetail('${p.id}')">
                ${cornerFramesHtml()}
                ${SPRITES[p.sprite]}
              </div>
              <div style="font-family:var(--font-serif);font-size:16px;font-weight:700;color:var(--navy);cursor:pointer;" onclick="openProductDetail('${p.id}')">${p.name}</div>
              <div style="font-size:12px;color:var(--ink-muted);flex:1;">${p.desc}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px;">
                <span style="font-weight:700;color:var(--gold-dark);">🪙 ${p.price} Xu</span>
                <div style="display:flex;gap:6px;">
                  <button class="btn btn-secondary btn-sm" onclick="openProductDetail('${p.id}')">Chi tiết</button>
                  <button class="btn btn-primary btn-sm" onclick="addToCart('${p.id}', 1)">+ Giỏ</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openProductDetail(pid) {
      const p = state.shopProducts.find(x => x.id === pid);
      window._detailQty = 1;
      openModal(`
        ${cornerFramesHtml()}
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <div style="width:92px;height:92px;background:var(--bg-paper);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;">
            ${SPRITES[p.sprite]}
          </div>
          <h3 style="font-family:var(--font-serif);font-size:20px;color:var(--navy);">${p.name}</h3>
          <div style="font-size:12.5px;color:var(--olive);font-weight:600;margin:4px 0 10px;">${p.duration}</div>
          <p style="font-size:13px;color:var(--ink-muted);margin-bottom:12px;">${p.usage}</p>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <button class="btn btn-secondary btn-sm" onclick="changeDetailQty(-1, ${p.price})">−</button>
            <strong id="detailQtyVal" style="font-size:16px;min-width:24px;">1</strong>
            <button class="btn btn-secondary btn-sm" onclick="changeDetailQty(1, ${p.price})">+</button>
          </div>
          <div style="font-weight:700;color:var(--gold-dark);margin-bottom:14px;">Tổng cộng: <span id="detailTotal">${p.price}</span> Xu</div>
          <div style="display:flex;gap:8px;width:100%;">
            <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Đóng</button>
            <button class="btn btn-primary" style="flex:2;" onclick="addToCart('${p.id}', window._detailQty); closeModal();">Thêm vào giỏ</button>
          </div>
        </div>
      `);
    }

    function changeDetailQty(delta, unitPrice) {
      window._detailQty = Math.max(1, (window._detailQty || 1) + delta);
      document.getElementById('detailQtyVal').textContent = window._detailQty;
      document.getElementById('detailTotal').textContent = window._detailQty * unitPrice;
    }

    function addToCart(pid, qty) {
      const existing = state.cart.find(c => c.id === pid);
      if (existing) existing.qty += qty;
      else state.cart.push({ id: pid, qty });
      renderTopbar();
      if (state.screen === 'shop') renderMain();
      showToast('Đã thêm vật phẩm vào giỏ hàng!');
    }

    function openCartModal() {
      const itemsHtml = state.cart.map(c => {
        const p = state.shopProducts.find(x => x.id === c.id);
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
            <div style="min-width:0;">
              <div style="font-weight:600;font-size:13.5px;color:var(--navy);">${p.name}</div>
              <div style="font-size:12px;color:var(--gold-dark);">${p.price} Xu × ${c.qty} = ${p.price * c.qty} Xu</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="btn btn-secondary btn-sm" onclick="updateCartQty('${c.id}', -1)">−</button>
              <span style="min-width:18px;text-align:center;font-weight:600;">${c.qty}</span>
              <button class="btn btn-secondary btn-sm" onclick="updateCartQty('${c.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      const total = state.cart.reduce((s, c) => {
        const p = state.shopProducts.find(x => x.id === c.id);
        return s + p.price * c.qty;
      }, 0);
      const notEnough = total > state.coins;

      openModal(`
        <h3 style="font-family:var(--font-serif);font-size:20px;color:var(--navy);margin-bottom:10px;">Giỏ hàng của bạn</h3>
        ${state.cart.length === 0 ? `
          <p style="color:var(--ink-muted);padding:18px 0;text-align:center;">Giỏ hàng đang trống. Hãy chọn hạt giống hoặc vật phẩm từ Cửa hàng.</p>
          <button class="btn btn-secondary" style="width:100%;" onclick="closeModal()">Đóng</button>
        ` : `
          <div>${itemsHtml}</div>
          <div style="display:flex;justify-content:space-between;margin:14px 0 6px;font-weight:700;font-size:15px;">
            <span>Tổng thanh toán:</span>
            <span style="color:var(--gold-dark);">🪙 ${total} Xu</span>
          </div>
          <div style="font-size:12px;color:${notEnough ? 'var(--rose)' : 'var(--ink-muted)'};margin-bottom:14px;">
            Số dư hiện tại: ${state.coins} Xu ${notEnough ? '— Không đủ Xu để thanh toán!' : ''}
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">Tiếp tục mua</button>
            <button class="btn btn-primary" style="flex:2;" ${notEnough ? 'disabled' : ''} onclick="checkoutCart()">Thanh toán ngay</button>
          </div>
        `}
      `);
    }

    function updateCartQty(pid, delta) {
      const idx = state.cart.findIndex(c => c.id === pid);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      renderTopbar();
      openCartModal();
    }

    function checkoutCart() {
      const total = state.cart.reduce((s, c) => {
        const p = state.shopProducts.find(x => x.id === c.id);
        return s + p.price * c.qty;
      }, 0);
      if (total > state.coins || state.cart.length === 0) return;

      state.coins -= total;
      const bought = [...state.cart];
      bought.forEach(c => {
        const cropItem = CROP_CATALOG.find(x => x.shopId === c.id);
        if (cropItem) state.inventory.seeds[cropItem.id] = (state.inventory.seeds[cropItem.id] || 0) + c.qty;
        else if (c.id === 'c_water') state.inventory.water += c.qty * 3;
        else if (c.id === 'c_fert') state.inventory.fertilizer += c.qty;
        else if (c.id === 'b_starter') {
          state.inventory.seeds.carrot += c.qty * 2;
          state.inventory.water += c.qty * 3;
          state.inventory.fertilizer += c.qty;
        } else {
          state.inventory.decor.push(c.id);
        }
      });
      state.cart = [];
      renderAll();

      openModal(`
        ${cornerFramesHtml()}
        <div style="text-align:center;">
          <div style="font-size:36px;margin-bottom:6px;">🎉</div>
          <h3 style="font-family:var(--font-serif);font-size:20px;color:var(--olive);margin-bottom:8px;">Mua hàng thành công!</h3>
          <p style="font-size:13px;color:var(--ink-muted);margin-bottom:14px;">Vật phẩm đã được chuyển vào Kho đồ của bạn.</p>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button class="btn btn-secondary" onclick="closeModal()">Ở lại Cửa hàng</button>
            <button class="btn btn-primary" onclick="closeModal(); navigate('inventory');">Xem Kho đồ</button>
          </div>
        </div>
      `);
    }

    // ============== INVENTORY & PROGRESSION ==============
    function renderInventory() {
      return `
        <div class="grid-2">
          <div class="pixel-frame">
            ${cornerFramesHtml()}
            <h3 class="card-title" style="margin-bottom:12px;">Hạt giống &amp; Tài nguyên chăm sóc</h3>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${Object.entries(state.inventory.seeds).map(([k, v]) => `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-paper);border-radius:10px;border:1px solid var(--border);">
                  <span style="display:flex;align-items:center;gap:8px;font-weight:600;text-transform:capitalize;">
                    <span style="transform:scale(0.6);width:26px;height:26px;display:flex;align-items:center;justify-content:center;">${SPRITES['seed_' + k] || SPRITES.seed}</span>
                    Hạt giống ${getCropNameVi(k)}
                  </span>
                  <span class="stat-pill">${v} hạt</span>
                </div>
              `).join('')}
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-paper);border-radius:10px;border:1px solid var(--border);">
                <span style="font-weight:600;">💧 Nước tưới</span>
                <span class="stat-pill">${state.inventory.water} lượt</span>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-paper);border-radius:10px;border:1px solid var(--border);">
                <span style="font-weight:600;">✨ Phân bón hữu cơ</span>
                <span class="stat-pill">${state.inventory.fertilizer} túi</span>
              </div>
            </div>
          </div>

          <div class="vintage-card">
            <h3 class="card-title" style="margin-bottom:12px;">Nông sản &amp; Lộ trình mở khóa</h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
              ${Object.entries(state.inventory.harvested).map(([k, v]) => `
                <span class="stat-pill olive">${getCropNameVi(k)}: ${v}</span>
              `).join('')}
            </div>
            <div style="padding:12px;background:var(--bg-paper);border:1px solid var(--border);border-radius:10px;">
              <div style="font-weight:700;color:var(--navy);margin-bottom:4px;">Bài 1: Fruits &amp; Vegetables (Đã mở)</div>
              <div style="font-size:12.5px;color:var(--olive);margin-bottom:10px;">✓ Đang học</div>
              <div style="font-weight:700;color:var(--navy);margin-bottom:4px;">Bài 2: Animals (Cần 3 Cà rốt)</div>
              <div style="font-size:12.5px;color:var(--ink-muted);">Tiến độ: ${state.inventory.harvested.carrot} / 3 Củ cà rốt</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMain() {
      const el = document.getElementById('mainContent');
      if (state.screen === 'dashboard') el.innerHTML = renderDashboard();
      else if (state.screen === 'review') el.innerHTML = renderReview();
      else if (state.screen === 'vocab') el.innerHTML = renderVocab();
      else if (state.screen === 'quiz') el.innerHTML = renderQuiz();
      else if (state.screen === 'result') el.innerHTML = renderResult();
      else if (state.screen === 'farm') el.innerHTML = renderFarm();
      else if (state.screen === 'shop') el.innerHTML = renderShop();
      else if (state.screen === 'inventory') el.innerHTML = renderInventory();
    }

    function renderAll() {
      renderNav();
      renderTopbar();
      renderMain();
    }

    renderAll();
  </script>
</body>
</html>
